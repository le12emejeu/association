name: Synchroniser agenda.ics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le fichier ICS depuis Google Agenda
        run: |
          curl -f -s -L "https://calendar.google.com/calendar/ical/le12emejeu%40gmail.com/public/basic.ics" -o agenda.ics.tmp
          grep -q "BEGIN:VCALENDAR" agenda.ics.tmp
          mv agenda.ics.tmp agenda.ics

      - name: Enregistrer agenda.ics s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.ics
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour quotidienne de agenda.ics"
            git push
          else
            echo "Aucun changement dans l'agenda."
          fi
